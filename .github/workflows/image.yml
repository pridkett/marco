name: Container image

# Publishes multi-arch images to ghcr.io/pridkett/marco: :edge and :sha-<7>
# from main, and semver tags for v* tags. ci.yml still owns the test suite.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          build-args: MARCO_BUILD_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the pull request image
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --platform linux/amd64 --load \
            --build-arg "MARCO_BUILD_VERSION=$GITHUB_SHA" -t marco:pr-test .
          sh scripts/smoke-test-image.sh marco:pr-test linux/amd64
      # QEMU runs the non-native images for this smoke test.
      - name: Smoke-test every platform
        if: github.event_name != 'pull_request'
        run: |
          for p in linux/amd64 linux/arm64 linux/arm/v7; do
            sh scripts/smoke-test-image.sh "ghcr.io/${{ github.repository }}:sha-${GITHUB_SHA::7}" "$p"
          done
