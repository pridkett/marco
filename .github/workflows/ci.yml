name: Verify and build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -trimpath -o dist/marco ./cmd/marco
      - run: ./dist/marco validate --config examples/marco.json
      - run: scripts/smoke-test.sh ./dist/marco

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, armv7]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and package
        env:
          MARCO_BUILD_VERSION: ${{ github.sha }}
        run: scripts/package-linux.sh "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: marco-linux-${{ matrix.arch }}
          path: dist/marco-linux-${{ matrix.arch }}.tar.gz
